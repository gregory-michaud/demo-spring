<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>New</title>
</head>
<body>
<h1>Nouveau Formateur</h1>

<form method="post" action="formateurs">
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" placeholder="Nom" required minlength="4" maxlength="250"><br>
    <label for="prenom">Prenom</label>
    <input type="text" id="prenom" name="prenom" placeholder="Prenom" required minlength="4" maxlength="250"><br>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Email" required><br>
    <button type="submit">Sauver</button>
</form>
</body>
</html>
